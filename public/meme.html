<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineTrack — Guess The Movie</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
      padding: 48px 20px;
    }

    .label {
      color: #666;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: -24px;
    }

    /* 4:5 Instagram Portrait Ratio */
    .slide {
      width: 540px;
      height: 675px;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background-color: #08080a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 50px 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    /* Subtle grain/vignette */
    .slide::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.8) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Soft ambient glows */
    .glow-blue {
      position: absolute;
      top: -100px;
      left: -100px;
      width: 300px;
      height: 300px;
      background: rgba(0, 150, 255, 0.15);
      filter: blur(80px);
      border-radius: 50%;
      z-index: 0;
    }
    
    .glow-purple {
      position: absolute;
      bottom: -100px;
      right: -100px;
      width: 300px;
      height: 300px;
      background: rgba(168, 85, 247, 0.15);
      filter: blur(80px);
      border-radius: 50%;
      z-index: 0;
    }

    /* Typography */
    .content {
      position: relative;
      z-index: 10;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .title {
      color: #ffffff;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1.2;
      margin-bottom: 8px;
      text-shadow: 0 4px 20px rgba(0,0,0,1);
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.6);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Mystery Card (Slide 1) */
    .mystery-card {
      position: relative;
      z-index: 10;
      width: 70%;
      aspect-ratio: 4/5;
      background: linear-gradient(145deg, rgba(30, 30, 40, 0.8), rgba(10, 10, 15, 0.8));
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 40px rgba(168,85,247,0.1);
      margin: 20px 0;
      overflow: hidden;
    }

    /* Film Strip Elements */
    .mystery-card::before, .mystery-card::after {
      content: "";
      position: absolute;
      left: 10px;
      top: 0;
      bottom: 0;
      width: 12px;
      background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.2) 0, rgba(255,255,255,0.2) 10px, transparent 10px, transparent 20px);
    }
    .mystery-card::after {
      left: auto;
      right: 10px;
    }

    .question-mark {
      font-size: 140px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 30px rgba(0,150,255,0.5), 0 0 80px rgba(168,85,247,0.4);
      background: -webkit-linear-gradient(#fff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulse-qm 2s infinite alternate;
    }

    @keyframes pulse-qm {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.05); filter: brightness(1.2); }
    }

    .bottom-text {
      position: relative;
      z-index: 10;
      color: rgba(255, 255, 255, 0.8);
      font-size: 18px;
      font-weight: 600;
      background: rgba(255,255,255,0.05);
      padding: 12px 24px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* Reveal Card (Slide 2) */
    .reveal-card {
      position: relative;
      z-index: 10;
      width: 85%;
      background: rgba(20, 20, 25, 0.7);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 60px rgba(0, 150, 255, 0.15);
      margin: 10px 0;
    }

    .poster {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .movie-title {
      color: #fff;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-transform: uppercase;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .tag {
      background: rgba(255,255,255,0.1);
      color: #fff;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tag span { color: #a855f7; }

  </style>
</head>
<body>

  <!-- ==========================================
       SLIDE 1: MOVIE GUESS (MYSTERY CARD)
       ========================================== -->
  <p class="label">Slide 1 — The Hook</p>
  <div class="slide" id="slide1">
    <div class="glow-blue"></div>
    <div class="glow-purple"></div>
    
    <div class="content">
      <h1 class="title">🎬 Can You Guess<br>The Movie?</h1>
      <p class="subtitle">Comment before swiping &rarr;</p>
    </div>

    <!-- Mystery Card -->
    <div class="mystery-card">
      <div class="question-mark">?</div>
    </div>

    <div class="bottom-text">
      Hint: Space • Time • Black Hole
    </div>
  </div>

  <!-- ==========================================
       SLIDE 2: MOVIE REVEAL
       ========================================== -->
  <p class="label">Slide 2 — The Reveal</p>
  <div class="slide" id="slide2">
    <div class="glow-blue" style="top: auto; bottom: -100px; left: 50%; transform: translateX(-50%); width: 400px;"></div>
    <div class="glow-purple" style="top: -100px; left: 50%; transform: translateX(-50%); width: 400px;"></div>
    
    <div class="content" style="margin-top: -10px;">
      <h2 class="title" style="font-size: 30px;">Answer</h2>
    </div>

    <div class="reveal-card">
      <!-- Using the newly generated original cinematic space illustration -->
      <img class="poster" src="astronaut_wormhole.png" alt="Interstellar Original Illustration" />
      
      <h3 class="movie-title">Interstellar</h3>
      
      <div class="tags">
        <div class="tag"><span>⭐</span> IMDb: 8.7</div>
        <div class="tag"><span>🎬</span> Genre: Sci-Fi</div>
        <div class="tag"><span>📅</span> Year: 2014</div>
      </div>
    </div>

    <div class="bottom-text" style="font-size: 16px;">
      Did you guess it correctly?
    </div>
  </div>

</body>
</html>
